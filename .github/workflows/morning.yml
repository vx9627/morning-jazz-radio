name: Generate Morning Radio

on:
  schedule:
    - cron: '15 22 * * 0-4' # KST Mon-Fri 07:15
    - cron: '15 23 * * 5,6' # KST Sat-Sun 08:15
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview: 대본 검토 / audio: 검토본 음성 / fresh_audio: 최신 방송 생성'
        type: choice
        default: preview
        options:
          - preview
          - audio
          - fresh_audio

permissions:
  contents: write

concurrency:
  group: morning-radio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Verify briefing logic
        run: python -m unittest -v test_build.py

      - name: Draft radio script only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python build.py --prepare-only --require-ai

      - name: Generate radio MP3
        if: github.event_name == 'schedule' || inputs.mode == 'audio' || inputs.mode == 'fresh_audio'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python build.py --require-ai ${{ inputs.mode == 'audio' && '--use-preview' || '' }}

      - name: Publish draft or audio
        env:
          RADIO_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' }}
        run: |
          git config user.name 'morning-radio-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$RADIO_PREVIEW" = 'true' ]; then
            git add output/preview.txt output/preview_sources.json
            message='Update radio script preview'
          else
            git add output/latest.mp3 output/latest.txt output/sources.json output/closing_history.json
            message='Update morning radio'
          fi
          git diff --cached --quiet || (git commit -m "$message" && git push)
