name: Generate Morning Radio

on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - run: pip install -r requirements.txt

      - name: Verify briefing logic
        run: python -m unittest -v test_build.py

      - name: Generate radio MP3
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build.py

      - name: Normalize playback volume
        run: |
          ffmpeg -hide_banner -loglevel error -y -i output/latest.mp3 -af loudnorm=I=-18:TP=-1.5:LRA=9 -ar 44100 -codec:a libmp3lame -b:a 160k output/normalized.mp3
          mv output/normalized.mp3 output/latest.mp3

      - name: Publish audio
        run: |
          git config user.name 'morning-radio-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/latest.mp3 output/latest.txt output/sources.json
          git diff --cached --quiet || (git commit -m "Update morning radio" && git push)
